name: WordPress installable ZIP packages

on:
  pull_request:
    paths:
      - "projects/**"
      - "wordpress/**"
      - "themes/**"
      - "plugins/**"
      - "scripts/wordpress/**"
      - ".github/workflows/wordpress-packages.yml"
  push:
    branches: [main]
    tags: ["wordpress-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Validate and package WordPress extensions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure releases originate from approved main history
        if: startsWith(github.ref, 'refs/tags/wordpress-v')
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tag must reference a commit reachable from main"
            exit 1
          }
      - name: Set up PHP for syntax validation
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: none
          coverage: none
      - name: Validate extension structure and build installable ZIPs
        run: python3 scripts/wordpress/build_packages.py --output dist/wordpress
      - name: Upload ZIP packages and checksums
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-installable-zips
          path: |
            dist/wordpress/*.zip
            dist/wordpress/manifest.json
            dist/wordpress/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Publish versioned GitHub Release from approved tag
        if: startsWith(github.ref, 'refs/tags/wordpress-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$TAG" dist/wordpress/*.zip dist/wordpress/manifest.json dist/wordpress/SHA256SUMS \
            --title "WordPress packages $TAG" --generate-notes --verify-tag

