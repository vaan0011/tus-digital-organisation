name: Verein Turnierplaner – Plugin-ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "projects/event-planner/plugin/verein-turnierplaner/**"
      - "design/logo/tus_logo.png"
      - ".github/workflows/build-verein-turnierplaner.yml"
  pull_request:
    paths:
      - "projects/event-planner/plugin/verein-turnierplaner/**"
      - "design/logo/tus_logo.png"
      - ".github/workflows/build-verein-turnierplaner.yml"

permissions:
  contents: read

jobs:
  build-plugin-zip:
    name: Installierbares Plugin-Paket erstellen
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Plugin-ZIP erstellen
        shell: bash
        run: |
          set -euo pipefail

          plugin="verein-turnierplaner"
          source="projects/event-planner/plugin/${plugin}"
          logo="design/logo/tus_logo.png"
          staging="${RUNNER_TEMP}/${plugin}"

          mkdir -p "${staging}"
          cp -R "${source}/." "${staging}/"
          cp "${logo}" "${staging}/assets/tus-mingolsheim-logo.png"
          find "${staging}" -name '.DS_Store' -delete

          mkdir -p dist
          (cd "${RUNNER_TEMP}" && zip -q -r "${GITHUB_WORKSPACE}/dist/${plugin}.zip" "${plugin}")

      - name: Plugin-ZIP als Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: verein-turnierplaner-plugin
          path: dist/verein-turnierplaner.zip
          if-no-files-found: error
          compression-level: 0
